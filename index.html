<!doctype html>
<html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MUUNGANO FAMILY CBOs</title>
<style>
:root{--navy:#153d7a;--pink:#e91e63;--ink:#172033;--muted:#687386;--bg:#f4f7fb;--line:#e3e9f2}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}.layout{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:#fff;border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 20px;border-bottom:1px solid var(--line)}.brand img{width:58px;height:58px;object-fit:contain}.brand strong{display:block;color:var(--navy);font-size:13px}.brand small{color:var(--muted);font-size:11px}.nav{padding-top:15px;display:grid;gap:5px}.nav button{border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:9px;color:#455168}.nav button.active,.nav button:hover{background:#edf3ff;color:var(--navy);font-weight:700}.main{min-width:0}.top{background:white;padding:17px 26px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.top h1{font-size:20px;margin:0}.top p{margin:4px 0 0;color:var(--muted);font-size:12px}.content{padding:24px;max-width:1500px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.head h2{margin:0;font-size:22px}.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--navy);color:white;font-weight:650}.btn.pink{background:var(--pink)}.btn.light{background:#edf2f8;color:#26344c}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.card,.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 3px 12px #1c2c4710}.card .label{font-size:12px;color:var(--muted)}.card .num{font-size:28px;font-weight:800;margin-top:8px;color:var(--navy)}.card .hint{font-size:11px;color:var(--muted);margin-top:5px}.panel h3{margin:0 0 14px;font-size:16px}.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:15px}.quick{display:flex;gap:8px;flex-wrap:wrap}.tablewrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:650px}th,td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{background:#f8faff;color:#526078;font-size:11px;text-transform:uppercase;letter-spacing:.04em}tr:last-child td{border-bottom:0}.muted{color:var(--muted)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:#48566d}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #d5deea;border-radius:8px;background:white;min-width:0}.field textarea{min-height:80px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:17px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}.toolbar input,.toolbar select{padding:10px;border:1px solid #d5deea;border-radius:8px;background:white}.status{padding:5px 8px;border-radius:99px;background:#e9f8ef;color:#167447;font-size:11px;font-weight:700}.status.wait{background:#fff3d8;color:#8a5b00}.empty{padding:26px;text-align:center;color:var(--muted)}.notice{padding:11px 13px;border-radius:8px;background:#eef5ff;color:#244b86;margin-bottom:15px;font-size:13px}.hidden{display:none!important}.footer{color:var(--muted);font-size:11px;margin-top:20px}.mobilemenu{display:none}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{height:auto;position:relative;border-right:0;border-bottom:1px solid var(--line);padding:10px}.brand{padding-bottom:10px}.nav{display:flex;overflow:auto;padding-top:10px}.nav button{white-space:nowrap}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.content{padding:15px}.top{padding:14px 16px}}@media(max-width:540px){.cards{gap:8px}.card{padding:13px}.card .num{font-size:23px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.top h1{font-size:17px}}
@media print{.side,.top,.no-print,.actions,.toolbar{display:none!important}.layout{display:block}.content{padding:0}.panel,.card{box-shadow:none;break-inside:avoid}body{background:white}}
</style></head><body><div class="layout"><aside class="side"><div class="brand"><img src="logo.png" alt="Nembo ya Muungano" onerror="this.style.display='none'"><div><strong>MUUNGANO FAMILY CBOs</strong><small>Better for Change Life</small></div></div><nav class="nav" id="nav"><button class="active" data-page="dashboard">▦ Dashboard</button><button data-page="members">♙ Wanachama</button><button data-page="funds">▤ Fedha za Biashara</button><button data-page="savings">◉ Akiba ya 10%</button><button data-page="attendance">✓ Mahudhurio</button><button data-page="gifts">♡ Zawadi / Msaada</button><button data-page="beneficiaries">♧ Wanufaika</button><button data-page="visits">⌂ Ziara za Majumbani</button><button data-page="reports">▧ Ripoti za A4</button><button data-page="leaders">♧ Viongozi</button><button data-page="settings">⚙ Muunganisho</button></nav></aside><main class="main"><header class="top"><div><h1 id="pageTitle">Dashboard ya Usimamizi</h1><p>Usimamizi wa shughuli za jamii kwa uwazi na ufanisi</p></div><button class="btn light no-print" onclick="window.print()">Chapisha</button></header><section class="content" id="app"></section></main></div>
<script>
const pages={dashboard:'Dashboard ya Usimamizi',members:'Usajili wa Wanachama',funds:'Fedha za Biashara',savings:'Akiba ya 10%',attendance:'Mahudhurio ya Shughuli',gifts:'Zawadi na Msaada',beneficiaries:'Orodha ya Wanufaika',visits:'Ziara za Majumbani',reports:'Ripoti za A4',leaders:'Viongozi na Timu',settings:'Muunganisho wa Mfumo'};
let current='dashboard', records={Members:[],Business_Funds:[],Monthly_Savings:[],Participation:[],Gifts:[],Beneficiaries:[],Home_Visits:[],Activity_Reports:[],Management_Teams:[]};let apiUrl=localStorage.getItem('mf_api_url')||'';
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function tableName(p){return ({members:'Members',funds:'Business_Funds',savings:'Monthly_Savings',attendance:'Participation',gifts:'Gifts',beneficiaries:'Beneficiaries',visits:'Home_Visits',reports:'Activity_Reports',leaders:'Management_Teams'})[p]}
function toast(msg){let n=document.createElement('div');n.className='notice';n.textContent=msg;$('#app').prepend(n);setTimeout(()=>n.remove(),4500)}
function setPage(p){current=p;$('#pageTitle').textContent=pages[p];document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
async function callApi(action,payload={}){if(!apiUrl)return null;try{let r=await fetch(apiUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...payload})});let j=await r.json();if(!j.ok)throw Error(j.error||'Hitilafu ya seva');return j.data}catch(e){toast('Hitilafu ya muunganisho: '+e.message);return null}}
async function loadAll(){if(!apiUrl)return;let d=await callApi('getAll');if(d)records={...records,...d};render()}
function count(t){return (records[t]||[]).length}function sum(t,k){return (records[t]||[]).reduce((a,r)=>a+(Number(r[k])||0),0)}
function dashboard(){return `<div class="head"><div><h2>Karibu MUUNGANO FAMILY CBOs</h2><div class="muted">Muhtasari wa taarifa za mfumo</div></div><button class="btn no-print" onclick="loadAll()">↻ Sasisha data</button></div><div class="cards"><div class="card"><div class="label">Wanachama wote</div><div class="num">${count('Members')}</div><div class="hint">Rekodi za wanachama</div></div><div class="card"><div class="label">Wanufaika</div><div class="num">${count('Beneficiaries')}</div><div class="hint">Rekodi za wanufaika</div></div><div class="card"><div class="label">Fedha za biashara</div><div class="num">KSh ${sum('Business_Funds','Amount').toLocaleString()}</div><div class="hint">Jumla iliyorekodiwa</div></div><div class="card"><div class="label">Akiba iliyolipwa</div><div class="num">KSh ${sum('Monthly_Savings','PaidAmount').toLocaleString()}</div><div class="hint">Jumla ya akiba</div></div><div class="card"><div class="label">Mahudhurio</div><div class="num">${count('Participation')}</div><div class="hint">Rekodi za ushiriki</div></div><div class="card"><div class="label">Zawadi / msaada</div><div class="num">KSh ${sum('Gifts','Amount').toLocaleString()}</div><div class="hint">Thamani ya msaada</div></div><div class="card"><div class="label">Ziara za majumbani</div><div class="num">${count('Home_Visits')}</div><div class="hint">Ziara zilizorekodiwa</div></div><div class="card"><div class="label">Ripoti</div><div class="num">${count('Activity_Reports')}</div><div class="hint">Ripoti zilizohifadhiwa</div></div></div><div class="grid2"><div class="panel"><h3>Vitendo vya haraka</h3><div class="quick"><button class="btn" onclick="setPage('members')">+ Sajili mwanachama</button><button class="btn pink" onclick="setPage('attendance')">+ Rekodi mahudhurio</button><button class="btn light" onclick="setPage('visits')">+ Rekodi ziara</button><button class="btn light" onclick="setPage('reports')">+ Andika ripoti</button></div></div><div class="panel"><h3>Hali ya mfumo</h3><p>${apiUrl?'<span class="status">Google Sheets imewekwa</span>':'<span class="status wait">Demo / haijaunganishwa</span>'}</p><p class="muted">${apiUrl?'Bonyeza Sasisha data ili kupata taarifa za karibuni.':'Weka URL ya Web App kwenye ukurasa wa Muunganisho ili kuhifadhi data kwenye Google Sheets.'}</p><button class="btn light" onclick="setPage('settings')">Mipangilio ya muunganisho</button></div></div>`}
const configs={members:{sheet:'Members',title:'Wanachama',id:'MemberID',fields:[['FullName','Majina kamili','text',1],['Sex','Jinsia','select',['Mwanamke','Mwanamume']],['DateOfBirth','Tarehe ya kuzaliwa','date'],['UNHCRID','UNHCR ID','text'],['Phone','Nambari ya simu','tel'],['Location','Eneo','select',['KKM 1','KKM 2','KKM 3','KKM 4','Kalobeyei 1','Kalobeyei 2','Kalobeyei 3']],['FamilySize','Ukubwa wa familia','number'],['Orphans','Idadi ya mayatima','number'],['Widows','Idadi ya wajane','number'],['JoinDate','Tarehe ya kujiunga','date'],['Status','Hali ya uanachama','select',['Inasubiri idhini','Mwanachama hai','Si hai']],['Notes','Maelezo ya ziada','textarea']]},funds:{sheet:'Business_Funds',title:'Fedha za Biashara',id:'RecordID',fields:[['FullName','Jina kamili','text',1],['UNHCRID','UNHCR ID','text'],['MemberID','MF-CBOs ID','text'],['Location','Eneo','text'],['BusinessType','Aina ya biashara','text'],['Amount','Kiasi (KSh)','number'],['DateReceived','Tarehe ya kupokea','date'],['UseNotes','Maelezo ya matumizi','textarea'],['ApprovedBy','Aliyeidhinisha','text'],['PaymentRef','Kumbukumbu ya malipo','text']]},savings:{sheet:'Monthly_Savings',title:'Akiba ya Mwezi',id:'RecordID',fields:[['FullName','Jina kamili','text',1],['MemberID','MF-CBOs ID','text'],['Month','Mwezi','select',['Januari','Februari','Machi','Aprili','Mei','Juni','Julai','Agosti','Septemba','Oktoba','Novemba','Desemba']],['Year','Mwaka','number'],['BaseAmount','Msingi wa hesabu (KSh)','number'],['Rate','Asilimia (%)','number'],['RequiredAmount','Akiba inayotakiwa (KSh)','number'],['PaidAmount','Akiba iliyolipwa (KSh)','number'],['Balance','Kiasi kilichobaki (KSh)','number'],['PaymentDate','Tarehe ya kuweka akiba','date'],['Status','Hali ya malipo','select',['Haijalipwa','Imelipwa kwa sehemu','Imelipwa']],['Notes','Maelezo','textarea']]},attendance:{sheet:'Participation',title:'Mahudhurio',id:'RecordID',fields:[['ActivityDate','Tarehe ya shughuli','date',1],['ActivityName','Jina la shughuli','text',1],['Purpose','Madhumuni','text'],['FullName','Jina la mwanachama','text',1],['UNHCRID','UNHCR ID','text'],['MemberID','MF-CBOs ID','text'],['Location','Eneo','text'],['Phone','Simu','tel'],['CheckIn','Muda wa kuingia','time'],['CheckOut','Muda wa kutoka','time'],['Supervisor','Msimamizi','text'],['Notes','Maelezo','textarea']]},gifts:{sheet:'Gifts',title:'Zawadi na Msaada',id:'RecordID',fields:[['GiftDate','Tarehe','date',1],['Purpose','Madhumuni','text'],['FullName','Jina la mpokeaji','text',1],['Sex','Jinsia','select',['Mwanamke','Mwanamume']],['UNHCRID','UNHCR ID','text'],['MemberID','MF-CBOs ID','text'],['MpesaNumber','Nambari ya M-Pesa','tel'],['Amount','Kiasi (KSh)','number'],['Location','Eneo','text'],['ApprovedBy','Aliyeidhinisha','text'],['Notes','Maelezo','textarea']]},beneficiaries:{sheet:'Beneficiaries',title:'Wanufaika',id:'RecordID',fields:[['FullName','Jina kamili','text',1],['DateOfBirth','Tarehe ya kuzaliwa','date'],['Sex','Jinsia','select',['Mwanamke','Mwanamume']],['Phone','Nambari ya simu','tel'],['UNHCRID','UNHCR ID','text'],['Location','Eneo','text'],['SupportType','Aina ya msaada','text'],['SupportDate','Tarehe ya msaada','date'],['Amount','Kiasi / thamani (KSh)','number'],['Status','Hali ya mnufaika','text'],['Notes','Maelezo','textarea']]},visits:{sheet:'Home_Visits',title:'Ziara za Majumbani',id:'VisitID',fields:[['VisitDate','Tarehe ya ziara','date',1],['FullName','Mtu / mwakilishi wa familia','text',1],['Sex','Jinsia','select',['Mwanamke','Mwanamume']],['FamilySize','Idadi ya wanafamilia','number'],['Phone','Simu','tel'],['UNHCRID','UNHCR ID','text'],['Location','Eneo','text'],['Purpose','Madhumuni ya ziara','textarea'],['FamilySituation','Hali ya familia','textarea'],['Needs','Msaada unaohitajika','textarea'],['ActionsTaken','Hatua zilizochukuliwa','textarea'],['Officer','Afisa aliyefanya ziara','text'],['NextVisitDate','Tarehe ya ziara inayofuata','date'],['NextPurpose','Madhumuni ya ziara inayofuata','text'],['Status','Hali ya ufuatiliaji','select',['Inasubiri','Imekamilika','Imeahirishwa']]]},reports:{sheet:'Activity_Reports',title:'Ripoti za A4',id:'ReportID',fields:[['Title','Kichwa cha ripoti','text',1],['Department','Idara / timu','text'],['Author','Mwandishi','text',1],['Position','Cheo','text'],['ActivityDate','Tarehe ya shughuli','date'],['Location','Eneo','text'],['Purpose','Madhumuni','textarea'],['Activities','Shughuli zilizofanyika','textarea'],['Participants','Idadi ya washiriki','number'],['Results','Matokeo','textarea'],['Challenges','Changamoto','textarea'],['Expenses','Fedha zilizotumika (KSh)','number'],['Recommendations','Mapendekezo','textarea'],['NextSteps','Hatua zinazofuata','textarea'],['ApprovalStatus','Hali ya idhini','select',['Rasimu','Inasubiri ukaguzi','Imeidhinishwa','Rudishwa kwa marekebisho']]]},leaders:{sheet:'Management_Teams',title:'Viongozi na Timu',id:'RecordID',fields:[['FullName','Jina kamili','text',1],['MemberID','MF-CBOs ID','text'],['UNHCRID','UNHCR ID','text'],['Sex','Jinsia','select',['Mwanamke','Mwanamume']],['Phone','Simu','tel'],['Location','Eneo','text'],['Position','Cheo','select',['Founder','CEO','President','Vice President','Secretary','Vice Secretary','Treasurer','Vice Treasurer','Community Representative']],['StartDate','Tarehe ya kuanza','date'],['EndDate','Tarehe ya kumaliza','date'],['Status','Hali','select',['Hai','Si hai']],['Notes','Maelezo','textarea']]}};
function fieldHtml(f){let [key,label,type,opts]=f;let inp='';if(type==='select')inp=`<select name="${key}" ${opts===1?'required':''}><option value="">Chagua...</option>${opts.map(x=>`<option>${esc(x)}</option>`).join('')}</select>`;else if(type==='textarea')inp='<textarea name="'+key+'"></textarea>';else inp=`<input name="${key}" type="${type}" ${opts===1?'required':''} ${type==='number'?'min="0"':''}>`;return `<div class="field ${type==='textarea'?'full':''}"><label>${label}${opts===1?' *':''}</label>${inp}</div>`}
function renderList(p){let c=configs[p],arr=records[c.sheet]||[];return `<div class="head"><div><h2>${c.title}</h2><div class="muted">Rekodi: ${arr.length}</div></div><button class="btn" onclick="showForm('${p}')">+ Ongeza rekodi</button></div><div class="toolbar"><input id="search" placeholder="Tafuta kwa jina, ID au eneo..." oninput="filterRows()"><button class="btn light" onclick="exportCsv('${p}')">Pakua CSV</button><button class="btn light" onclick="window.print()">Chapisha / PDF</button></div><div class="tablewrap"><table><thead><tr><th>ID</th>${c.fields.slice(0,5).map(f=>`<th>${f[1]}</th>`).join('')}<th>Vitendo</th></tr></thead><tbody id="rows">${rowsHtml(p,arr)}</tbody></table>${arr.length?'':'<div class="empty">Hakuna rekodi bado. Bonyeza “Ongeza rekodi” kuanza.</div>'}</div><div id="formArea"></div>`}
function rowsHtml(p,arr){let c=configs[p];return arr.map((r,i)=>`<tr><td>${esc(r[c.id]||r.ID||'—')}</td>${c.fields.slice(0,5).map(f=>`<td>${esc(r[f[0]]||'—')}</td>`).join('')}<td><button class="btn light" onclick="showForm('${p}',${i})">Angalia / Hariri</button></td></tr>`).join('')}
function showForm(p,index=null){let c=configs[p],r=index===null?{}:(records[c.sheet]||[])[index]||{};$('#formArea').innerHTML=`<div class="panel" style="margin-top:16px"><div class="head"><h3>${index===null?'Ongeza rekodi': 'Hariri rekodi'}</h3><button class="btn light" onclick="$('#formArea').innerHTML=''">Funga</button></div><form id="recordForm" class="formgrid">${c.fields.map(f=>fieldHtml(f)).join('')}<div class="field full"><div class="actions"><button class="btn" type="submit">Hifadhi rekodi</button><button class="btn light" type="button" onclick="$('#formArea').innerHTML=''">Ghairi</button></div></div><input type="hidden" name="__index" value="${index===null?'':index}"></form></div>`;c.fields.forEach(f=>{let el=$(`#recordForm [name="${f[0]}"]`);if(el&&r[f[0]]!==undefined)el.value=r[f[0]]});$('#recordForm').onsubmit=async e=>{e.preventDefault();let fd=new FormData(e.target),obj={};c.fields.forEach(f=>obj[f[0]]=fd.get(f[0])||'');if(p==='savings'){let base=Number(obj.BaseAmount)||0,rate=Number(obj.Rate);if(!rate)rate=10;obj.Rate=rate;obj.RequiredAmount=base*rate/100;obj.Balance=Math.max(0,Number(obj.RequiredAmount)-Number(obj.PaidAmount||0));if(obj.Balance===0)obj.Status='Imelipwa';else if(Number(obj.PaidAmount)>0)obj.Status='Imelipwa kwa sehemu';else obj.Status='Haijalipwa'}obj[c.id]=r[c.id]||`${c.id.replace('ID','').toUpperCase()}-${Date.now()}`;obj.CreatedAt=r.CreatedAt||new Date().toISOString();obj.UpdatedAt=new Date().toISOString();if(apiUrl){let result=await callApi(index===null?'create':'update',{sheet:c.sheet,record:obj,id:obj[c.id]});if(!result)return;}if(index===null)(records[c.sheet]||(records[c.sheet]=[])).unshift(obj);else records[c.sheet][index]=obj;toast('Rekodi imehifadhiwa.');render()}}
function filterRows(){let q=($('#search')?.value||'').toLowerCase();let arr=records[configs[current].sheet]||[];let filtered=arr.filter(r=>Object.values(r).some(v=>String(v).toLowerCase().includes(q)));$('#rows').innerHTML=rowsHtml(current,filtered)}
function exportCsv(p){let c=configs[p],arr=records[c.sheet]||[],cols=[c.id,...c.fields.map(f=>f[0])];let csv=[cols.join(','),...arr.map(r=>cols.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(','))].join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}));a.download=c.sheet+'.csv';a.click();URL.revokeObjectURL(a.href)}
function settings(){return `<div class="head"><div><h2>Muunganisho wa Google Sheets</h2><div class="muted">https://script.google.com/macros/s/AKfycbxxqSF6QqyzrDjNuXW0PlmcRjlfxf41ZELTzVLcpuTkqenmvoXWA2VxYsMNGURZkK6s/exec</div></div></div><div class="notice">Kwa sasa unaweza kujaribu muonekano na fomu. Bila URL ya backend, data hubaki kwenye kumbukumbu ya ukurasa huu na haitakuwa salama au ya kudumu. Kwa matumizi halisi, weka backend na ruhusa za watumiaji kabla ya kuhifadhi taarifa nyeti.</div><div class="panel"><form id="settingsForm"><div class="field"><label>Google Apps Script Web App URL</label><input id="apiUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(apiUrl)}"></div><div class="actions"><button class="btn" type="submit">Hifadhi muunganisho</button><button class="btn light" type="button" onclick="testConnection()">Jaribu muunganisho</button><button class="btn light" type="button" onclick="loadAll()">Soma data</button></div></form><p class="muted">Hatua za kusakinisha zipo kwenye faili README.md pamoja na backend Code.gs.</p></div>`}
function render(){if(current==='dashboard')$('#app').innerHTML=dashboard();else if(current==='settings')$('#app').innerHTML=settings();else $('#app').innerHTML=renderList(current);if(current==='settings')$('#settingsForm').onsubmit=e=>{e.preventDefault();apiUrl=$('#apiUrl').value.trim();localStorage.setItem('mf_api_url',apiUrl);toast('URL imehifadhiwa kwenye kivinjari hiki.');render()}}
async function testConnection(){apiUrl=$('#apiUrl').value.trim();if(!apiUrl){toast('Tafadhali weka URL kwanza.');return}localStorage.setItem('mf_api_url',apiUrl);let d=await callApi('ping');if(d)toast('Muunganisho umefanikiwa.')}
render();
</script></body></html>
